name: Build generic NRO runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-generic-nro-runtime.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Build Ubuntu 20.04 compatible runtime
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/nro-runtime"
          out="$work/runtime"
          mkdir -p "$out"

          docker run --rm -v "$out:/bundle" ubuntu:20.04 bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive

            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl unzip

            apt-get -y --download-only --no-install-recommends install               tigervnc-standalone-server tigervnc-tools x11-xkb-utils xkb-data xfonts-base               fonts-dejavu-core libx11-6 libxext6 libxi6 libxrender1 libxtst6               libxrandr2 libxfixes3 libxinerama1 libxcb1 libxau6 libxdmcp6

            for deb in /var/cache/apt/archives/*.deb; do
              dpkg-deb -x "$deb" /bundle
            done

            mkdir -p /bundle/microemu /tmp/microemu
            curl -fL --retry 4               https://downloads.sourceforge.net/project/microemulator/microemulator/2.0.4/microemulator-2.0.4.zip               -o /tmp/microemu.zip
            unzip -q /tmp/microemu.zip -d /tmp/microemu
            src="$(find /tmp/microemu -maxdepth 3 -type f -name microemulator.jar -printf "%h\n" | head -n1)"
            test -n "$src"
            cp -a "$src"/. /bundle/microemu/
          '

          test -x "$out/usr/bin/Xtigervnc"
          test -x "$out/usr/bin/xkbcomp"
          test -x "$out/usr/bin/tigervncpasswd"
          test -s "$out/usr/share/X11/xkb/keycodes/evdev"
          test -s "$out/microemu/microemulator.jar"

          tar -C "$out" -czf nro-runtime-focal-amd64.tar.gz .
          sha256sum nro-runtime-focal-amd64.tar.gz > nro-runtime-focal-amd64.tar.gz.sha256
          ls -lh nro-runtime-focal-amd64.tar.gz
          du -sh "$out"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="nro-runtime-v1"
          repo="russel2138/test"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag"               nro-runtime-focal-amd64.tar.gz               nro-runtime-focal-amd64.tar.gz.sha256               --repo "$repo"               --clobber
          else
            gh release create "$tag"               nro-runtime-focal-amd64.tar.gz               nro-runtime-focal-amd64.tar.gz.sha256               --repo "$repo"               --title "Portable NRO runtime v1"               --notes "Ubuntu 20.04 amd64 compatible MicroEmulator + TigerVNC runtime for generic Java hosts."
          fi
