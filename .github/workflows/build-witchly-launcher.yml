name: Build Witchly sneakyhub launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "witchly/SneakyHub.java"
      - ".github/workflows/build-witchly-launcher.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build sneakyhub.jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          javac --release 17 -d build witchly/SneakyHub.java
          jar cfe sneakyhub.jar SneakyHub -C build SneakyHub.class
          java -jar sneakyhub.jar --help >/tmp/launcher-smoke.log 2>&1 || true
          ls -lh sneakyhub.jar
          sha256sum sneakyhub.jar > sneakyhub.jar.sha256

      - name: Publish launcher release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="witchly-launcher-v1"
          repo="russel2138/test"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag"               sneakyhub.jar sneakyhub.jar.sha256               --repo "$repo" --clobber
          else
            gh release create "$tag"               sneakyhub.jar sneakyhub.jar.sha256               --repo "$repo"               --title "Witchly sneakyhub launcher v1"               --notes "Executable Java 17 launcher for Witchly's fixed startup command."
          fi
